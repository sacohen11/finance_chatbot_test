<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Assistant</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1>Finance Assistant</h1>
    <p>Ask for trends, category comparisons, or budget vs actual breakdowns.</p>

    <form id="assistant-form">
      <input id="query" name="query" placeholder="e.g. Show monthly revenue trend" required />
      <button type="submit">Ask</button>
    </form>

    <section id="answer" class="card"></section>

    <section class="split">
      <div class="card">
        <div class="section-header">
          <h2>Table</h2>
          <button id="download-csv" type="button" disabled>Download CSV</button>
        </div>
        <div id="table-wrap">No data yet.</div>
      </div>

      <div class="card">
        <div class="section-header">
          <h2>Chart</h2>
          <button id="download-png" type="button" disabled>Export PNG</button>
        </div>
        <div id="chart" style="width:100%;height:360px;"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
