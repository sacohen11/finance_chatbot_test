description = "Schema and migration setup for finance chatbot"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
